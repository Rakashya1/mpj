<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart - ShopNow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <!-- Header (same as other pages) -->
    <header class="sticky-top bg-white border-bottom shadow-sm">
      <div class="container px-4 py-3">
        <div class="row align-items-center">
          <div class="col-md-3 col-6">
            <a href="/" class="text-decoration-none">
              <h1 class="h4 fw-bold text-primary mb-0">ShopNow</h1>
            </a>
          </div>
          <div class="col-md-6 d-none d-md-block">
            <nav class="d-flex gap-4">
              <a
                href="/"
                class="text-decoration-none text-body-secondary fw-medium"
                >Home</a
              >
              <a
                href="/products"
                class="text-decoration-none text-body-secondary fw-medium"
                >Products</a
              >
              <a
                href="#"
                class="text-decoration-none text-body-secondary fw-medium"
                >New Arrivals</a
              >
              <a
                href="#"
                class="text-decoration-none text-body-secondary fw-medium"
                >Deals</a
              >
            </nav>
          </div>
          <div class="col-md-3 col-6 text-end">
            <div class="d-flex align-items-center justify-content-end gap-3">
              <form
                class="d-none d-md-flex"
                action="/products/search"
                method="get"
              >
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    name="query"
                    placeholder="Search products..."
                  />
                  <button class="btn btn-outline-secondary" type="submit">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
              </form>
              <a href="/cart" class="btn btn-primary position-relative">
                <i class="bi bi-cart"></i>
                <span
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  id="header-cart-count"
                >
                  0
                </span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Mobile Search - visible only on small screens -->
    <div class="d-md-none container px-4 py-3">
      <form action="/products/search" method="get">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            name="query"
            placeholder="Search products..."
          />
          <button class="btn btn-outline-secondary" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>
    </div>

    <!-- Cart Content -->
    <main class="container py-5">
      <h1 class="mb-4">Your Shopping Cart</h1>

      <div class="row">
        <!-- Cart Items -->
        <div class="col-lg-8">
          <div class="card mb-4">
            <div class="card-body">
              <div
                id="empty-cart"
                class="text-center py-5"
                style="display: none"
              >
                <i class="bi bi-cart text-muted" style="font-size: 3rem"></i>
                <p class="mt-3 fw-medium">Your cart is empty</p>
                <p class="text-muted">Add some products to your cart</p>
                <a href="/products" class="btn btn-primary mt-3">
                  Continue Shopping
                </a>
              </div>

              <div id="cart-items">
                <div class="table-responsive">
                  <table class="table align-middle">
                    <thead>
                      <tr>
                        <th scope="col">Product</th>
                        <th scope="col">Price</th>
                        <th scope="col">Quantity</th>
                        <th scope="col">Total</th>
                        <th scope="col"></th>
                      </tr>
                    </thead>
                    <tbody id="cart-items-list">
                      <!-- Cart items will be dynamically added here -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- Continue Shopping & Clear Cart -->
          <div class="d-flex justify-content-between mb-4">
            <a href="/products" class="btn btn-outline-primary">
              <i class="bi bi-arrow-left me-2"></i> Continue Shopping
            </a>
            <button id="clear-cart" class="btn btn-outline-danger">
              <i class="bi bi-trash me-2"></i> Clear Cart
            </button>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="col-lg-4">
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">Order Summary</h5>
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-between mb-2">
                <span>Subtotal</span>
                <span id="cart-subtotal">$0.00</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span>Shipping</span>
                <span id="cart-shipping">$9.99</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span>Tax (8%)</span>
                <span id="cart-tax">$0.00</span>
              </div>
              <hr />
              <div class="d-flex justify-content-between fw-bold">
                <span>Total</span>
                <span id="cart-total">$0.00</span>
              </div>

              <button class="btn btn-primary w-100 mt-4" id="checkout-btn">
                Proceed to Checkout <i class="bi bi-arrow-right"></i>
              </button>
            </div>
          </div>

          <!-- Promo Code -->
          <div class="card mt-3">
            <div class="card-body">
              <h6 class="mb-3">Apply Promo Code</h6>
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter code"
                  id="promo-code"
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="apply-promo"
                >
                  Apply
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Load cart from localStorage
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const cartItemsList = document.getElementById("cart-items-list");
        const emptyCart = document.getElementById("empty-cart");
        const cartItems = document.getElementById("cart-items");
        const headerCartCount = document.getElementById("header-cart-count");

        // Update header cart count
        const totalItems = cart.reduce(
          (total, item) => total + item.quantity,
          0,
        );
        headerCartCount.textContent = totalItems;

        // Show empty cart message if cart is empty
        if (cart.length === 0) {
          emptyCart.style.display = "block";
          cartItems.style.display = "none";
          document.getElementById("clear-cart").disabled = true;
          document.getElementById("checkout-btn").disabled = true;
        } else {
          emptyCart.style.display = "none";
          cartItems.style.display = "block";

          // Populate cart items
          cartItemsList.innerHTML = "";
          cart.forEach((item) => {
            const row = document.createElement("tr");
            const itemTotal = item.price * item.quantity;

            row.innerHTML = `
              <td>
                <div class="d-flex align-items-center">
                  <img src="${item.image}" alt="${item.name}" class="rounded" style="width: 60px; height: 60px; object-fit: cover;">
                  <div class="ms-3">
                    <h6 class="mb-0">${item.name}</h6>
                    <small class="text-muted">${item.category}</small>
                  </div>
                </div>
              </td>
              <td>$${item.price.toFixed(2)}</td>
              <td>
                <div class="quantity-control d-flex align-items-center">
                  <button class="btn btn-sm btn-outline-secondary decrease-quantity" data-id="${item.id}">
                    <i class="bi bi-dash"></i>
                  </button>
                  <span class="mx-2">${item.quantity}</span>
                  <button class="btn btn-sm btn-outline-secondary increase-quantity" data-id="${item.id}">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
              </td>
              <td>$${itemTotal.toFixed(2)}</td>
              <td>
                <button class="btn btn-sm btn-outline-danger remove-item" data-id="${item.id}">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            `;

            cartItemsList.appendChild(row);
          });

          // Add event listeners to cart item buttons
          document.querySelectorAll(".decrease-quantity").forEach((button) => {
            button.addEventListener("click", (e) => {
              const productId = e.currentTarget.getAttribute("data-id");
              updateQuantity(productId, -1);
            });
          });

          document.querySelectorAll(".increase-quantity").forEach((button) => {
            button.addEventListener("click", (e) => {
              const productId = e.currentTarget.getAttribute("data-id");
              updateQuantity(productId, 1);
            });
          });

          document.querySelectorAll(".remove-item").forEach((button) => {
            button.addEventListener("click", (e) => {
              const productId = e.currentTarget.getAttribute("data-id");
              removeItem(productId);
            });
          });
        }

        // Update cart summary
        updateCartSummary();

        // Clear cart button
        document.getElementById("clear-cart").addEventListener("click", () => {
          if (confirm("Are you sure you want to clear your cart?")) {
            localStorage.removeItem("cart");
            window.location.reload();
          }
        });

        // Apply promo code button
        document.getElementById("apply-promo").addEventListener("click", () => {
          const promoCode = document.getElementById("promo-code").value.trim();
          if (promoCode) {
            alert("Promo code applied: " + promoCode);
            // In a real app, you would validate the promo code and apply discount
          } else {
            alert("Please enter a promo code");
          }
        });

        // Checkout button
        document
          .getElementById("checkout-btn")
          .addEventListener("click", () => {
            alert("Proceeding to checkout...");
            // In a real app, you would redirect to checkout page
          });

        // Helper functions
        function updateQuantity(productId, change) {
          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          const item = cart.find((item) => item.id === productId);

          if (item) {
            item.quantity = Math.max(1, item.quantity + change);
            localStorage.setItem("cart", JSON.stringify(cart));
            window.location.reload();
          }
        }

        function removeItem(productId) {
          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          const updatedCart = cart.filter((item) => item.id !== productId);
          localStorage.setItem("cart", JSON.stringify(updatedCart));
          window.location.reload();
        }

        function updateCartSummary() {
          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          const subtotal = cart.reduce(
            (total, item) => total + item.price * item.quantity,
            0,
          );
          const shipping = subtotal > 0 ? 9.99 : 0;
          const tax = subtotal * 0.08;
          const total = subtotal + shipping + tax;

          document.getElementById("cart-subtotal").textContent =
            `$${subtotal.toFixed(2)}`;
          document.getElementById("cart-shipping").textContent =
            `$${shipping.toFixed(2)}`;
          document.getElementById("cart-tax").textContent =
            `$${tax.toFixed(2)}`;
          document.getElementById("cart-total").textContent =
            `$${total.toFixed(2)}`;
        }
      });
    </script>
  </body>
</html>

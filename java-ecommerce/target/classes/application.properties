# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=ecommerce

# Enhanced Elasticsearch Configuration
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=3s
spring.elasticsearch.username=
spring.elasticsearch.password=
spring.elasticsearch.restclient.sniffer.interval=300s
spring.elasticsearch.restclient.sniffer.delay-after-failure=60s

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging Configuration
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.data.elasticsearch=DEBUG
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.data.elasticsearch.core=DEBUG
logging.level.org.elasticsearch.client=DEBUG

# Allow bean definition overriding to resolve conflicts
spring.main.allow-bean-definition-overriding=true